<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Default CPU fan curve: 9 percent up to 43 °C, rising to 40 percent at 58 °C, warning zone up to 64 °C, then 100 percent">
  <style>
    text { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; }
    .fg { fill: #1f2328; }
    .muted { fill: #59636e; }
    .grid { stroke: #d1d9e0; stroke-width: 1; }
    .axis { stroke: #59636e; stroke-width: 1.5; }
    .curve { fill: none; stroke: #0969da; stroke-width: 3.5; stroke-linejoin: round; }
    .point { fill: #0969da; }
    .dot { fill: #0969da; stroke: #ffffff; stroke-width: 3; }
    .safety { fill: none; stroke: #cf222e; stroke-width: 3; stroke-dasharray: 7 6; }
    .warn { fill: #bf8700; opacity: .12; }
    .danger { fill: #cf222e; opacity: .12; }
    .warn-text { fill: #9a6700; }
    .danger-text { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .grid { stroke: #3d444d; }
      .axis { stroke: #9198a1; }
      .curve { stroke: #4493f8; }
      .point { fill: #4493f8; }
      .dot { fill: #4493f8; stroke: #0d1117; }
      .safety { stroke: #f85149; }
      .danger-text { fill: #f85149; }
      .warn-text { fill: #d29922; }
    }
  </style>

  <!-- x: 30..70 °C -> 60..660, y: 0..100 % -> 300..40 -->
  <rect class="warn" x="480" y="40" width="90" height="260"/>
  <rect class="danger" x="570" y="40" width="90" height="260"/>
  <text class="warn-text" x="525" y="60" text-anchor="middle">warning</text>
  <text class="warn-text" x="525" y="76" text-anchor="middle">+10 %/poll</text>
  <text class="danger-text" x="615" y="60" text-anchor="middle">danger</text>
  <text class="danger-text" x="615" y="76" text-anchor="middle">100 %</text>

  <g class="grid">
    <line x1="60" y1="235" x2="660" y2="235"/>
    <line x1="60" y1="170" x2="660" y2="170"/>
    <line x1="60" y1="105" x2="660" y2="105"/>
    <line x1="60" y1="40" x2="660" y2="40"/>
    <line x1="210" y1="40" x2="210" y2="300"/>
    <line x1="360" y1="40" x2="360" y2="300"/>
    <line x1="510" y1="40" x2="510" y2="300"/>
  </g>
  <line class="axis" x1="60" y1="300" x2="660" y2="300"/>
  <line class="axis" x1="60" y1="40" x2="60" y2="300"/>

  <g class="muted" text-anchor="middle">
    <text x="60" y="320">30</text><text x="210" y="320">40</text><text x="360" y="320">50</text>
    <text x="510" y="320">60</text><text x="660" y="320">70</text>
    <text x="360" y="346">CPU temperature (°C)</text>
  </g>
  <g class="muted" text-anchor="end">
    <text x="50" y="304">0</text><text x="50" y="239">25</text><text x="50" y="174">50</text>
    <text x="50" y="109">75</text><text x="50" y="44">100</text>
  </g>
  <text class="muted" x="20" y="170" text-anchor="middle" transform="rotate(-90 20 170)">fan speed (%)</text>

  <path class="safety" d="M480 196 L570 196 L570 40 L660 40"/>
  <path id="curve" class="curve" d="M60 276.6 L255 276.6 L330 261 L405 235 L480 196"/>
  <g class="point">
    <circle cx="255" cy="276.6" r="5"/><circle cx="330" cy="261" r="5"/>
    <circle cx="405" cy="235" r="5"/><circle cx="480" cy="196" r="5"/>
  </g>
  <g class="fg">
    <text x="255" y="294" text-anchor="middle">43 °C · 9 %</text>
    <text x="318" y="248" text-anchor="end">48 °C · 15 %</text>
    <text x="393" y="222" text-anchor="end">53 °C · 25 %</text>
    <text x="468" y="183" text-anchor="end">58 °C · 40 %</text>
  </g>

  <circle class="dot" r="8">
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1">
      <mpath href="#curve"/>
    </animateMotion>
  </circle>
</svg>
